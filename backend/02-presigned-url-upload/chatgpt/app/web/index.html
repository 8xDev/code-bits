<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Posts — Presigned Upload Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-4xl mx-auto">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">Posts — Presigned Upload Demo</h1>
      <p class="text-gray-600">Direct-to-MinIO uploads with presigned URLs (PUT & POST) and multipart init.</p>
      <div class="mt-2">
        <a href="/swagger" class="text-sm text-blue-600">API Docs (Swagger)</a>
      </div>
    </header>

    <section class="bg-white p-4 rounded shadow mb-6">
      <h2 class="text-xl font-semibold mb-2">Create Post (presigned flow)</h2>
      <form id="preForm" class="space-y-3">
        <div>
          <label class="block text-sm font-medium">Title</label>
          <input id="title" name="title" class="mt-1 block w-full border rounded p-2" required />
        </div>
        <div>
          <label class="block text-sm font-medium">Description</label>
          <textarea id="description" name="description" class="mt-1 block w-full border rounded p-2"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium">Media (image/video, max 10MB)</label>
          <input id="media" type="file" accept="image/*,video/*" class="mt-1" required />
        </div>
        <div>
          <label class="block text-sm font-medium">Upload method</label>
          <select id="method" class="mt-1 border rounded p-2">
            <option value="post">Presigned POST (recommended)</option>
            <option value="put">Presigned PUT</option>
          </select>
        </div>
        <div>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Upload</button>
        </div>
      </form>
      <div id="message" class="mt-2 text-sm"></div>
    </section>

    <section id="posts" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- posts render here -->
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
