services:
  app:
    build: ./app
    container_name: posts-app
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-setup:
        condition: service_started
    networks:
      - app-net

  worker:
    build: ./worker
    container_name: posts-worker
    env_file:
      - .env
    ports:
      - "9002:9002"
    depends_on:
      - minio
      - postgres
    networks:
      - app-net

  postgres:
    image: postgres:15
    container_name: posts-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  minio:
    image: minio/minio
    container_name: posts-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-net

  minio-setup:
    image: minio/mc
    container_name: posts-minio-setup
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      echo "Waiting for MinIO to become available..."
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} >/dev/null 2>&1; do
        echo "MinIO not ready, retrying..."
        sleep 2
      done
      echo "MinIO is ready. Creating bucket..."
      mc mb --ignore-existing local/${MINIO_BUCKET}

      echo "Configuring webhook for worker service..."
      mc admin config set local notify_webhook:1 \
        endpoint="http://worker:9002/minio/events" \
        auth_token=""

      echo "Restarting MinIO to apply webhook config..."
      mc admin service restart local || true

      echo "MinIO setup complete (bucket '${MINIO_BUCKET}' ensured)."
    networks:
      - app-net

volumes:
  pgdata:
  minio_data:

networks:
  app-net:
    driver: bridge
