version: '3.8'
services:
  app:
    build: ./app
    container_name: obs-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/tasks_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - OTEL_COLLECTOR_ENDPOINT=otel-collector:4317
      - PROM_PORT=9090
      - SVC_NAME=tasks-service
    depends_on:
      - postgres
      - redis
      - otel-collector
    networks:
      - observ-net

  postgres:
    image: postgres:15
    container_name: obs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_db
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - observ-net

  redis:
    image: redis:7
    container_name: obs-redis
    ports:
      - "6379:6379"
    networks:
      - observ-net

  prometheus:
    image: prom/prometheus:latest
    container_name: obs-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alert_rules:/etc/prometheus/alert_rules
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - observ-net

  grafana:
    image: grafana/grafana:10.0.1
    container_name: obs-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - observ-net

  loki:
    image: grafana/loki:2.8.2
    container_name: obs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - observ-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.90.0
    container_name: obs-otel-collector
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml
    command:
      - "--config=/etc/otel-collector-config.yml"
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # pprof/metrics
    networks:
      - observ-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: obs-pg-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - observ-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: obs-redis-exporter
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "9121:9121"
    networks:
      - observ-net

networks:
  observ-net:
    driver: bridge
