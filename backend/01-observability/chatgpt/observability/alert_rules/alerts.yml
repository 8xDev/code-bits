groups:
- name: example-alerts
  rules:
  - alert: HighErrorRate
    expr: sum(rate(http_requests_total{code=~"5.."}[2m])) / sum(rate(http_requests_total[2m])) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"

  - alert: ExcessiveBlockedRequests
    expr: increase(rate_limiter_blocked_total[5m]) > 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "Spike in blocked requests"
