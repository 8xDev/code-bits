global:
  scrape_interval: 15s # Default scrape interval
  evaluation_interval: 15s # Default evaluation interval

# Load alert rules from this file
rule_files:
  - /etc/prometheus/alert.rules.yml

# Scrape configurations
scrape_configs:
  # 1. Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Go App (metrics exposed on port 8081)
  - job_name: "go-app"
    static_configs:
      - targets: ["go-app:8081"]

  # 3. Postgres Exporter
  - job_name: "pg_exporter"
    static_configs:
      - targets: ["pg_exporter:9187"]

  # 4. Redis Exporter
  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis_exporter:9121"]

  # 5. OTel Collector (exposes its own internal metrics)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  # 6. Loki
  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  # 7. Tempo
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
